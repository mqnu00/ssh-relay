# WSL has 7.6GB RAM total (~4GB free); keep every JVM small so the emulator and
# Gradle can coexist. Raise these if you give WSL more memory via .wslconfig.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
# This network resets connections to dl.google.com, and AGP's response is to block
# the build on "Still waiting for package manifests to be fetched remotely".
# Every SDK component is pinned locally by scripts/provision.py (including the
# package.xml metadata AGP looks for), so remote SDK resolution is unnecessary:
# fail fast instead of hanging.
android.builder.sdkDownload=false

kotlin.code.style=official
